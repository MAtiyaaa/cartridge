name: Android

# Builds the APK for pull requests so Android breakage shows up before a release.
# The APK is kept as a workflow artifact for testing on a device.
on:
  pull_request:
    paths: ['src/**', 'electron/**', 'android/**', 'android-backend/**', 'scripts/**', 'package.json', 'package-lock.json', 'vite.config.mjs', 'capacitor.config.json', 'index.html', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Android NDK version
        run: |
          V=$(sed -n "s/.*ndkVersion = '\\(.*\\)'.*/\\1/p" android/variables.gradle)
          echo "NDK_VERSION=$V" >> "$GITHUB_ENV"
          echo "NDK_DIR=$ANDROID_HOME/ndk/$V" >> "$GITHUB_ENV"
      # The NDK is cached and installed before the build. Gradle used to download it (about 700 MB) in the
      # middle of every build, and a broken download ("Archive is not a ZIP archive") failed the APK.
      - name: Android NDK (cache)
        id: ndk
        uses: actions/cache@v4
        with:
          path: ${{ env.NDK_DIR }}
          key: android-ndk-${{ env.NDK_VERSION }}
      - name: Android NDK (install, checked, with retries)
        if: steps.ndk.outputs.cache-hit != 'true'
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for i in 1 2 3 4 5; do
            rm -rf "$NDK_DIR"
            yes | "$SDKM" --install "ndk;$NDK_VERSION" > "$RUNNER_TEMP/ndk.log" 2>&1 || true
            if [ -f "$NDK_DIR/source.properties" ] && [ -x "$NDK_DIR/ndk-build" ]; then echo "NDK $NDK_VERSION installed"; exit 0; fi
            echo "NDK install attempt $i failed, retrying"; tail -5 "$RUNNER_TEMP/ndk.log"; sleep $((i * 15))
          done
          echo "::error::Could not install NDK $NDK_VERSION"; exit 1
      - run: npm ci
      - name: Desktop UI still builds without Android code
        run: |
          npm run build:ui
          ! grep -l "CartridgeNative\\|android:companion" dist/assets/*.js
      - name: Android backend starts on Node 18 (the runtime inside the APK)
        run: |
          npm run build:android -- --no-sync
          cd android-dist/nodejs
          mkdir -p "$RUNNER_TEMP/sd/ROMs/nds" "$RUNNER_TEMP/data"
          CARTRIDGE_STORAGE="$RUNNER_TEMP/sd" CARTRIDGE_DATA="$RUNNER_TEMP/data" CARTRIDGE_PORT=47100 CARTRIDGE_TOKEN=ci npx -y node@18 android-main.js > "$RUNNER_TEMP/node.log" 2>&1 &
          for i in $(seq 1 20); do curl -sf -XPOST -H 'x-cart-token: ci' localhost:47100/ipc/fs:detect > "$RUNNER_TEMP/detect.json" && break; sleep 1; done
          cat "$RUNNER_TEMP/detect.json"
          grep -q '"ROMs"\|/ROMs' "$RUNNER_TEMP/detect.json"
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon || { echo 'Build failed, trying once more (network hiccups)'; sleep 20; ./gradlew assembleRelease --no-daemon; }
      - uses: actions/upload-artifact@v4
        with:
          name: Cartridge-android
          path: android/app/build/outputs/apk/release/app-release.apk
